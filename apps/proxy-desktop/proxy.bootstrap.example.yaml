# server, logging, and capture are copied into SQLite settings on first open.
# After that, runtime values come from the database (desktop Settings → Proxy variables).
server:
  host: 127.0.0.1
  port: 8080
  max_request_bytes: 10485760

storage:
  database_path: ./data/proxy.db
  journal_mode: WAL
  busy_timeout_ms: 5000
  synchronous: NORMAL

logging:
  # info: request routing + errors; debug: successful proxy API key auth
  level: info
  # console = colored terminal (tint); json = structured logs for Docker/aggregators
  format: console

capture:
  mode: metadata
  # store_content: true persists prompts/responses in ai_request_prompts + ai_request_responses (PII risk)
  store_content: false
  # store_upstream_body_on_error: persist truncated raw upstream body on HTTP 4xx/5xx or usage parse_error
  store_upstream_body_on_error: true
  file_dump:
    enabled: false
    directory: ./data/http-dumps
    errors_only: false
    max_body_bytes: 1048576
  max_prompt_bytes: 262144
  max_response_bytes: 1048576

persistence:
  batch_size: 100
  batch_delay_ms: 250
  queue_capacity: 10000
